// INLINE CSS

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body>
    <h1 style="color: blue; content:center;">Hello, World!</h1>
    <p style="font-size: 16px;"> my name is shivanshu. </p>
    </body>
</html>


// external css

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 class="shi">Hello, World!</h1>
    <p>my name is shivanshu </p>
    </body>
</html>
